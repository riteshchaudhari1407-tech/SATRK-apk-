name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build APK
        run: |
          # Agar android folder ke bajaye kahin aur gradle file hai toh us directory mein switch karenge
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            gradle wrapper
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -d "android" ]; then
            cd android
            if [ ! -f "gradlew" ]; then
              gradle wrapper
            fi
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle build files not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
