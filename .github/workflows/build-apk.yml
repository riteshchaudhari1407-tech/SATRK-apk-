name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-locate Gradle & Build APK
        run: |
          # Automatically find where settings.gradle is located in the repo
          GRADLE_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -z "$GRADLE_DIR" ]; then
            echo "Error: settings.gradle not found anywhere in repository!"
            exit 1
          echo "Found project directory at: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
